name: Build Floresta Fire PSP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          make clean || true
          make

      - name: Verificar arquivos gerados
        run: |
          ls -la
          test -f EBOOT.PBP && echo "EBOOT.PBP gerado com sucesso" || echo "EBOOT.PBP não encontrado"

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaFire-EBOOT
          path: EBOOT.PBP
          if-no-files-found: warn

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaFire-ELF
          path: FlorestaFire.elf
          if-no-files-found: warn
          
