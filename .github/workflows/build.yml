name: FlorestaFire

platform: psp
target: EBOOT.PBP
version: "0.1.0"

description: >
  Jogo multiplayer estilo Free Fire para PSP / PPSSPP.
  Tiro, construção, mapa florestal e 4 jogadores (com bots).

sources:
  - main.c

includes:
  - .

libs:
  - pspgu
  - pspgum
  - pspge
  - pspdisplay
  - pspctrl
  - psppower
  - psprtc
  - m
  - c

cflags:
  - -O2
  - -G0
  - -Wall
  - -D_PSP_FW_VERSION=150

pbp:
  title: "Floresta Fire"
  icon0: NULL
  pic1: NULL

build:
  compiler: psp-gcc
  output: EBOOT.PBP
  makefile: Makefile

notes: >
  Este projeto é homebrew para PSP.
  O resultado final é o arquivo EBOOT.PBP.
  Coloque o EBOOT.PBP na pasta PSP/GAME/FlorestaFire/ para rodar no PPSSPP.
  Não é um ISO comercial, é homebrew nativo.
  
