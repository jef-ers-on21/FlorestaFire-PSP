# ============================================================
# Floresta Fire - build.yml
# Configuração de build para PSPSDK / PPSSPP
# ============================================================
# Este arquivo descreve como compilar o projeto.
# Você pode usar com scripts personalizados ou converter para Makefile.
#
# Requisitos:
#   - PSPSDK instalado (psptoolchain)
#   - make
#   - psp-gcc, psp-g++, psp-as, etc.
# ============================================================

project:
  name: FlorestaFire
  version: "0.1.0"
  target: EBOOT.PBP
  platform: psp
  description: "Battle Royale estilo Free Fire para PSP - 4 jogadores + bots"

# --------------------------------------------------
# Arquivos fonte
# --------------------------------------------------
sources:
  - main.c
  # Adicione mais conforme o projeto crescer:
  # - game/player.c
  # - game/bot.c
  # - game/weapon.c
  # - game/build.c
  # - game/map.c
  # - game/zone.c
  # - graphics/render.c
  # - common/math.c

# --------------------------------------------------
# Includes
# --------------------------------------------------
includes:
  - .
  # - game
  # - graphics
  # - common

# --------------------------------------------------
# Bibliotecas do PSPSDK necessárias
# --------------------------------------------------
libs:
  - pspgu          # Gráficos (GU)
  - pspgum         # Matrix helpers
  - pspge          # Graphics Engine
  - pspdisplay     # Display
  - pspctrl        # Controles
  - psppower       # Clock / power
  - psprtc         # Timer de alta resolução
  - pspaudio       # (futuro) som
  - pspaudiolib    # (futuro)
  - m              # math
  - c
  - pspvfpu        # VFPU (opcional, mas bom)

# --------------------------------------------------
# Flags de compilação (otimizadas para PSP)
# --------------------------------------------------
cflags:
  - -O2                    # Otimização boa (não use -O3 em tudo)
  - -G0                    # Dados pequenos no registrador
  - -Wall
  - -Wextra
  - -fno-exceptions
  - -fno-rtti
  - -D_PSP_FW_VERSION=150  # Compatibilidade
  # -DDEBUG               # Descomente para debug

cxxflags:
  - -O2
  - -G0
  - -Wall
  - -fno-exceptions
  - -fno-rtti

asflags:
  - -c

ldflags:
  - -Wl,-zmax-page-size=128

# --------------------------------------------------
# Configurações do EBOOT.PBP
# --------------------------------------------------
pbp:
  title: "Floresta Fire"
  icon0: "NULL"            # Coloque ICON0.PNG depois (144x80)
  icon1: "NULL"
  pic0: "NULL"
  pic1: "NULL"             # PIC1.PNG (480x272) fundo do menu
  snd0: "NULL"

# --------------------------------------------------
# Build steps (para referência / scripts)
# --------------------------------------------------
build_steps:
  - name: compile
    command: >
      psp-gcc $(cflags) -I$(includes) -c main.c -o main.o

  - name: link
    command: >
      psp-gcc main.o -L$(PSPSDK)/lib $(libs: -l%) -o FlorestaFire.elf

  - name: fixup
    command: psp-fixup-imports FlorestaFire.elf

  - name: create_pbp
    command: >
      mksfoex "$(pbp.title)" PARAM.SFO &&
      pack-pbp EBOOT.PBP PARAM.SFO $(pbp.icon0) NULL NULL $(pbp.pic0) NULL NULL FlorestaFire.elf NULL

# --------------------------------------------------
# Comandos úteis (Makefile equivalente)
# --------------------------------------------------
# make          → compila tudo e gera EBOOT.PBP
# make clean    → limpa objetos e binários
# make run      → (se tiver ppsspp-cli) roda no emulador
#
# Exemplo de Makefile mínimo correspondente:
#
# TARGET = FlorestaFire
# OBJS = main.o
# LIBS = -lpspgu -lpspgum -lpspge -lpspdisplay -lpspctrl -lpsppower -lpsprtc -lm -lc
#
# CFLAGS = -O2 -G0 -Wall
# CXXFLAGS = $(CFLAGS)
# EXTRA_TARGETS = EBOOT.PBP
# PSP_EBOOT_TITLE = Floresta Fire
#
# PSPSDK = $(shell psp-config --pspsdk-path)
# include $(PSPSDK)/lib/build.mak

# --------------------------------------------------
# Notas de otimização gráficas (já aplicadas no main.c)
# --------------------------------------------------
# - Display list grande (262144)
# - Clock forçado em 333/333/166
# - Iluminação fixed-function (só 1 luz direcional)
# - Clear color verde floresta
# - Câmera terceira pessoa simples
# - Bots atualizados de forma desincronizada (0.35s+)
# - Máximo 32 balas e 64 construções
# - Sem texturas ainda (próximo passo: atlas 128x128 swizzled)
name: Build PSP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSPSDK
        run: |
          # (aqui você coloca a instalação do psptoolchain)
          echo "Instale o PSPSDK via action ou container"
      - name: Build
        run: make
      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaFire
          path: EBOOT.PBP
